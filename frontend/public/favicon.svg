<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 复刻侧边栏 .sidebar .brand .logo 的样式：
       28×28 / border-radius 6 → 按 64 viewbox 放大约 2.3 倍
       background: var(--primary) = #ff2442（小红书主题色）
       color: #fff 粗体 EZ -->
  <rect width="64" height="64" rx="14" fill="#ff2442"/>
  <text
    x="32" y="44"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    fill="#ffffff"
  >EZ</text>
</svg>
